<div class="register-shell">
  <mat-card class="register-card">
    <div class="brand-block">
      <h1>Create account</h1>
      <p>Join BrightSmile Dental and start managing your care.</p>
    </div>

    <form class="register-form" (ngSubmit)="register()">
      <mat-form-field appearance="outline">
        <mat-label>Email</mat-label>
        <input matInput id="email" type="email" [(ngModel)]="email" name="email" placeholder="you@example.com" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Password</mat-label>
        <input matInput id="password" type="password" [(ngModel)]="password" name="password" placeholder="Choose a password" />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Role</mat-label>
        <mat-select [(ngModel)]="role" name="role">
          <mat-option value="Patient">Patient</mat-option>
          <mat-option value="Dentist">Dentist</mat-option>
          <mat-option value="Admin">Admin</mat-option>
        </mat-select>
      </mat-form-field>

      <button mat-flat-button color="primary" type="submit" [disabled]="isSubmitting">
        {{ isSubmitting ? 'Creating account...' : 'Register' }}
      </button>
    </form>

    <div class="auth-links">
      <a routerLink="/login">Already have an account?</a>
      <a routerLink="/">Back to home</a>
    </div>
  </mat-card>
</div>
